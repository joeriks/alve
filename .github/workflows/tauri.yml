name: Tauri native acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup update stable --no-self-update
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test -p alve-core --locked
      - run: cargo build -p alve-core --bins --locked
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: cargo test -p alve --locked
      - run: cargo build -p alve-core --bin alve-mcp --release --locked
      - run: npm run check
      - run: npm run build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: alve-${{ matrix.os }}
          path: |
            target/release/alve.exe
            target/release/alve-mcp.exe
          if-no-files-found: error
