name: Android acceptance and APK
on:
  push:
    branches: [main, codex/working-poc]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configure Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup update stable --no-self-update
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
      - run: npm run test:agents
      - name: Generate native Android project
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          node scripts/prepare-android.mjs
      - name: Build release APK
        run: npm run tauri -- android build --ci --apk --target aarch64
      - name: Collect install and signing artifacts
        run: |
          mkdir -p android-artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp '{}' android-artifacts/ \;
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifacts/apksigner.jar
          cp src-tauri/gen/android/app/build/outputs/apk/*/release/output-metadata.json android-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: alve-android-release
          path: android-artifacts/*
          if-no-files-found: error
      - name: Build emulator APK
        run: npm run tauri -- android build --ci --debug --apk --target x86_64
      - run: python -m pip install websocket-client
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alve-android-acceptance
          path: android-test-results/*
