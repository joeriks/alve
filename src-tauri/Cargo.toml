[package]
name = "alve"
version = "0.2.0"
edition = "2021"
default-run = "alve"

[lib]
name = "alve_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
alve-core = { path = "../crates/alve-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "io-util"] }
axum = "0.8"
url = "2"
base64 = "0.22"
