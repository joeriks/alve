<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Alve — minimal interface preview</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;--bg:light-dark(#fafaf8,#151716);--ink:light-dark(#242825,#e5e9e6);--muted:light-dark(#69716b,#a0aaa3);--line:light-dark(#e0e4df,#303731);--panel:light-dark(#fff,#202521);--accent:light-dark(#35644a,#acd0b7)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}button,input,textarea{font:inherit;color:inherit}button,summary{cursor:pointer}button{background:transparent;border:0;padding:8px 12px;text-align:left}input,textarea{background:transparent;border:1px solid var(--line);border-radius:5px;padding:10px;width:100%}textarea{min-height:160px;resize:vertical}button:hover,summary:hover{background:var(--panel)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
header{max-width:940px;margin:auto;padding:22px 24px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line)}.brand{font-weight:650;font-size:19px;padding:0}.search{flex:1;border:0;padding:8px 0;min-width:0}.menu{position:relative}.menu>summary{padding:7px 12px;border-radius:5px;list-style:none}.menu>summary::-webkit-details-marker{display:none}.menu>summary:after{content:' ▾';color:var(--muted)}.menu-panel{max-height:calc(100dvh - 85px);overflow:auto;position:absolute;z-index:5;right:0;top:calc(100% + 8px);width:225px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:0 8px 30px #0002}.menu-panel button{display:block;width:100%;border-radius:4px}.menu-panel hr{border:0;border-top:1px solid var(--line);margin:6px}.menu-panel button:hover{background:var(--bg)}
main{max-width:840px;margin:0 auto;padding:34px 24px 72px}h1{font-size:23px;line-height:1.35;font-weight:600;margin:0 0 22px}h2{font-size:18px;font-weight:600}.row{display:block;width:100%;padding:19px 0;border-bottom:1px solid var(--line)}.row strong{display:block;font-weight:550;font-size:16px}.row p{color:var(--muted);margin:5px 0 0;font-size:14px}.tags{color:var(--muted);font-size:12px;margin-top:7px}.detail-head{display:flex;align-items:start;justify-content:space-between;gap:16px}.detail-head h1{margin:0}.back{display:inline-block;color:var(--muted);padding:0;margin-bottom:25px}.body{max-width:65ch;white-space:pre-wrap;margin:26px 0}.facts{border-collapse:collapse;width:100%;margin:26px 0}.facts th,.facts td{border-bottom:1px solid var(--line);padding:10px 0;text-align:left}.facts th{font-weight:400;color:var(--muted);width:45%}.reference{margin-top:24px;color:var(--muted)}.reference summary{padding:4px 0}.reference p{font-size:14px}.editor label{display:block;margin:18px 0 7px}.editor footer{display:flex;gap:8px;margin-top:22px}.save{background:var(--panel);border:1px solid var(--line);border-radius:5px}.hint,.empty{color:var(--muted);font-size:14px}.empty{padding:22px 0}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:26px;max-width:480px;width:calc(100% - 40px)}dialog::backdrop{background:#0006}dialog h2{margin-top:0}dialog button{border:1px solid var(--line);border-radius:5px;margin-top:12px}@media(max-width:540px){header{padding:16px;gap:18px}main{padding:28px 20px}.brand{font-size:18px}.search{font-size:14px}.menu>summary{padding:7px 4px}h1{font-size:21px}.row p{font-size:13px}}
</style>
</head>
<body>
<header><button class="brand" data-command="memories" aria-label="Alve memories">Alve</button><input class="search" id="search" type="search" aria-label="Search memories" placeholder="Search memories"><details class="menu" id="main-menu"><summary>Menu</summary><nav class="menu-panel" aria-label="Application"><button data-command="new">New memory</button><hr><button data-command="memories">Memories</button><button data-command="graph">Memory graph</button><button data-command="vaults">Vaults</button><button data-command="proposals">AI proposals</button><hr><button data-command="connections">AI access</button><button data-command="ai">Connect an AI</button><button data-command="backup">Storage, backup &amp; sync</button><button data-command="updates">Check for updates</button><button data-command="lock">Lock vault</button><hr><button data-command="about">About this preview</button></nav></details></header>
<main id="content"></main>
<dialog id="info" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-copy"></p><button id="close-info">Close</button></dialog>
<script>
(() => {
'use strict';
const memories=[
{id:'insurance',title:'Home insurance renews on November 1',body:'Review the terms and compare the premium before renewal.',tags:['home','insurance'],facts:[['Renewal date','November 1, 2026'],['Annual premium','SEK 3,450']],source:'Example insurance letter · page 2'},
{id:'sync',title:'Sync directly over Wi-Fi or a phone hotspot',body:'Devices should exchange changes on the same local network. Away from home, connect the laptop to the phone hotspot. Without a connection, use the last synchronized information.',tags:['alve','decision'],facts:[],source:'Product discussion · September 30, 2026. Automatic LAN synchronization remains future work.'},
{id:'writing',title:'Main point first, references last',body:'Give each memory a meaningful summary heading. Keep the text concise, from one sentence to half an A4 page when needed. Put supporting details in references.',tags:['personal','preference'],facts:[],source:'Writing preference · example memory'}
];
const content=document.querySelector('#content'),search=document.querySelector('#search');let selected=null,editing=false;
const escape=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function closeMenus(){document.querySelectorAll('.menu[open]').forEach(menu=>menu.open=false);}
function leaveEditor(){return !editing || confirm('Discard this preview edit?');}
function list(){editing=false;selected=null;const q=search.value.trim().toLowerCase();const rows=memories.filter(m=>[m.title,m.body,...m.tags,...m.facts.flat()].join(' ').toLowerCase().includes(q));content.innerHTML='<h1>Memories</h1>'+rows.map(m=>`<button class="row" data-memory="${escape(m.id)}"><strong>${escape(m.title)}</strong><p>${escape(m.body.split('. ')[0])}</p><div class="tags">${m.tags.length?'Tags: '+m.tags.map(t=>'#'+escape(t)).join(' '):'Tags: No tags'}</div></button>`).join('')+(rows.length?'':'<p class="empty">No matching memories.</p>');}
function detail(id){editing=false;selected=id;const m=memories.find(m=>m.id===id);content.innerHTML=`<button class="back" data-command="memories">← Memories</button><div class="detail-head"><h1>${escape(m.title)}</h1><details class="menu"><summary>Actions</summary><div class="menu-panel"><button data-command="edit">Edit memory</button><button data-command="use-ai">Use with AI</button></div></details></div><div class="tags">${m.tags.length?'Tags: '+m.tags.map(t=>'#'+escape(t)).join(' '):'Tags: No tags'}</div><p class="body">${escape(m.body)}</p>${m.facts.length?'<table class="facts" aria-label="Precise facts"><tbody>'+m.facts.map(f=>`<tr><th scope="row">${escape(f[0])}</th><td>${escape(f[1])}</td></tr>`).join('')+'</tbody></table>':''}<details class="reference"><summary>Reference</summary><p>${escape(m.source)}</p></details>`;}
function editor(id){editing=true;selected=id;const m=memories.find(m=>m.id===id);content.innerHTML=`<form class="editor"><h1>${m?'Edit memory':'New memory'}</h1><label for="title">Main point</label><input id="title" name="title" required maxlength="160" value="${escape(m?.title||'')}"><label for="body">Necessary details</label><textarea id="body" name="body" maxlength="2000">${escape(m?.body||'')}</textarea><label for="tags">Tags</label><input id="tags" name="tags" value="${escape(m?.tags.join(', ')||'')}"><p class="hint">Example data only. Preview changes last until this page reloads.</p><footer><button type="submit" class="save">Save memory</button><button type="button" data-command="cancel">Cancel</button></footer></form>`;content.querySelector('form').onsubmit=event=>{event.preventDefault();const title=content.querySelector('#title').value.trim();if(!title){content.querySelector('#title').focus();return;}const values={title,body:content.querySelector('#body').value.trim(),tags:content.querySelector('#tags').value.split(',').map(t=>t.trim()).filter(Boolean)};if(m)Object.assign(m,values);else{const entry={id:crypto.randomUUID(),...values,facts:[],source:'Added in this preview.'};memories.unshift(entry);selected=entry.id;}editing=false;detail(selected);};content.querySelector('#title').focus();}
function storage(){editing=false;selected=null;content.innerHTML=`<h1>Storage, backup &amp; sync</h1><p class="hint">Preview only: no data is persisted here.</p><h2>Stored locally. Your backup responsibility.</h2><p>Alve stores an encrypted vault on your device. There is no Alve-hosted copy or automatic backup. You must keep independent backups and your vault password. Alve cannot recover a forgotten password.</p><h2>Keep recoverable copies</h2><ol><li>Export an encrypted .alve bundle after important changes.</li><li>Keep dated copies on a separate device or offline storage.</li><li>Keep the exporting vault password safely and separately. Test restore in a fresh installation.</li></ol><p class="hint">Bundles include confirmed memories, relations and revision history. AI access grants and pending proposals are excluded. Plain JSON exports are unencrypted.</p><h2>Current version: manual exchange</h2><ol><li>Export on device A and transfer the file yourself to B.</li><li>Restore on a fresh B, or import into B if it already has the same vault.</li><li>Export from B and import on A too to exchange edits in both directions.</li><li>Review conflicting memories. Import merges history rather than replacing the vault.</li></ol><p>Each device only knows the changes it has received. Saving here does not update another device. Synchronization is not backup.</p><details class="reference"><summary>Planned peer-to-peer sync</summary><p>Explicit pairing and user-started sync over a local network or phone hotspot, with per-device status and conflict review. Automatic LAN/hotspot sync and native phone apps are not available yet.</p></details>`;}
function info(title,copy){document.querySelector('#info-title').textContent=title;document.querySelector('#info-copy').textContent=copy;document.querySelector('#info').showModal();}
const descriptions={ai:['Connect an AI','In the desktop app: unlock Alve, open Connections, choose exactly which memories and permissions to share, and copy the one-time scoped token. Open Connect an AI for the actual localhost endpoint and MCP configuration. Configure your local AI client to launch the installed alve-mcp.exe with ALVE_URL and ALVE_TOKEN. Never give AI your vault password. Keep Alve open and unlocked; ask AI to read alve://usage and search a shared memory. Saving requires your confirmation and approval in Proposals. Cloud AI clients may send memories to their provider. This preview has no endpoint or real token.'],vaults:['Vaults','Example vault: Personal. No AI access is active. The desktop POC manages one vault per running instance.'],proposals:['AI proposals','No proposals in this preview. In Alve, select related pending proposals and approve them once. Optionally create a shared group with belongs_to relations in that same approval. Review the exact tags or No tags before approving. AI suggestions remain proposals until owner approval.'],connections:['AI access','No AI is connected to this preview. In Alve, you choose the memories and permissions granted to each client.'],backup:['Storage, backup & sync','This preview does not persist data. Alve stores an encrypted vault on your device, with no hosted copy or automatic backup. You must keep dated encrypted .alve bundles on separate storage and retain your password; Alve cannot recover it. Test restore in a fresh installation. Today, transfer bundles yourself: restore on a fresh device or import into the same vault, exchange both ways, and review conflicts. AI grants and pending proposals are excluded. Each device only knows the changes it has received. Sync is not backup. Automatic LAN/hotspot sync and native phone apps are not available yet.'],updates:['Check for updates','In the desktop app, Help > Check for updates checks for a newer signed release when you ask. This preview performs no network requests.'],lock:['Lock vault','This is a visual preview with no real vault. Use Lock vault in the app to clear decrypted memory and revoke its current session.'],about:['About this preview','A minimal interface sketch with editable example memories. Nothing is persisted or sent to an AI. The desktop POC supports local encrypted memory, scoped AI access and manual bundle exchange. Phone apps and automatic LAN sync remain future work.'],'use-ai':['Use with AI','In Alve, grant an AI client scoped access through a local connection. This preview sends no data.']};
document.addEventListener('click',event=>{const memory=event.target.closest('[data-memory]');if(memory){detail(memory.dataset.memory);return;}const button=event.target.closest('[data-command]');if(button){const command=button.dataset.command;closeMenus();if(command==='cancel'){editing=false;selected?detail(selected):list();return;}if(['new','memories','graph','backup'].includes(command)&&!leaveEditor())return;if(command==='new')editor(null);else if(command==='edit')editor(selected);else if(command==='memories')list();else if(command==='backup')storage();else if(command==='graph'){editing=false;content.innerHTML='<h1>Memory graph</h1><p class="hint">Related memories</p>'+memories.map(m=>`<button class="row" data-memory="${escape(m.id)}"><strong>${escape(m.title)}</strong><div class="tags">${m.tags.length?'Tags: '+m.tags.map(t=>'#'+escape(t)).join(' '):'Tags: No tags'}</div></button>`).join('');}else if(descriptions[command])info(...descriptions[command]);}else if(!event.target.closest('.menu'))closeMenus();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const open=document.querySelector('.menu[open]');closeMenus();open?.querySelector('summary').focus();}});
search.addEventListener('input',()=>{if(editing){if(!leaveEditor()){search.value='';return;}}list();});document.querySelector('#close-info').onclick=()=>document.querySelector('#info').close();list();
})();
</script>
</body>
</html>
